name: CI

on:
  pull_request:

# "cargo" default package results in v1.95
# chmod vmlinuz-`uname -r` as it's 0600 by default
# chmod /dev/kvm to allow non-root QEMU to use it
# if building distro config install: libdw-dev libssl-dev
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck --severity=error autorun/*.sh cut/*.sh rapido
      - name: Run Rust format check and clippy lint
        run: |
          cargo --offline --version
          cargo --offline fmt --check --all
          cargo --offline clippy -- -A warnings -A clippy::byte_char_slices
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    # aarch64 github runners don't provide kvm, but perform well without
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install rust and kernel build tools
        run: |
          case "$(uname -m)" in
          x86_64)
            export QEMU_SYSTEM=qemu-system-x86
            ;;
          aarch64)
            export QEMU_SYSTEM=qemu-system-arm
            ;;
          *)
            exit 1
            ;;
          esac
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends --no-install-suggests \
            "$QEMU_SYSTEM" qemu-utils make flex bison libelf-dev
          sudo lsblk
          df
      - name: run unit tests
        run: |
          # tests/* integration tests run later
          cargo --offline test --lib --bin "*"
          cargo --offline test --manifest-path src/cpio/Cargo.toml
          cargo --offline test --manifest-path src/kv-conf/Cargo.toml
          cargo --offline test --manifest-path src/kmod-parser/Cargo.toml
      - name: build and setup rapido net
        run: |
          cargo --offline build --release
          cp -r net-conf.example/ net-conf
          sudo EDITOR=cat ./rapido setup-network -o $USER -b rapido-br -a "192.168.155.10/24"
          sudo chmod 0644 /boot/vmlinuz-*
          [ -c /dev/kvm ] && sudo chmod 0666 /dev/kvm || true
      - name: boot host kernel VM
        run: |
         ./rapido cut -B -x "ping -c3 192.168.155.10 && echo test passed; exit" simple-network
         ./target/release/lscpio initrds/myinitrd
         ./rapido boot
      - name: run integration tests with host kernel
        run: |
          cargo --offline test --test "*"
      - name: clone and build mainline kernel
        run: |
          git clone --depth 1 -b master https://github.com/torvalds/linux ${HOME}/linux
          cp kernel/selftest.defconfig ${HOME}/linux/.config
          pushd ${HOME}/linux
          make olddefconfig
          make -j$(nproc)
          make modules_install INSTALL_MOD_PATH=./mods
          # this gives us modules.dep, etc. which rapido needs.
          # XXX should come with modules_install but doesn't... perhaps due to no modules?
          objtree=./ INSTALL_MOD_PATH=./mods ./scripts/depmod.sh "$(cat include/config/kernel.release)"
          popd
      - name: boot mainline kernel VM
        run: |
          printf "KERNEL_SRC=${HOME}/linux\nKERNEL_INSTALL_MOD_PATH=${HOME}/linux/mods\n" > rapido.conf
          ./rapido cut -x "cat /proc/filesystems; exit" simple-network
      - name: run integration tests with mainline kernel
        run: |
          # selftests create their own rapido.conf, considering KERNEL_X envs
          export KERNEL_SRC=${HOME}/linux KERNEL_INSTALL_MOD_PATH=${HOME}/linux/mods
          cargo --offline test --test "*"
